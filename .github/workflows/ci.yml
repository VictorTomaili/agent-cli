name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # engines is >=22: the test script's glob (node --test test/*.test.js)
        # needs the runner's own pattern expansion (Node 21+, cmd.exe doesn't
        # glob), and skill tool modules are ESM-in-.js relying on module
        # syntax detection. 18 and 20 are both EOL.
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
