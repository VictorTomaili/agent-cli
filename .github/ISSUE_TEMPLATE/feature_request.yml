name: Feature request
description: Propose a capability the CLI does not have.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that is awkward or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
      description: A command shape, a flag, an output — concrete beats abstract.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered
      description: Including "I did X by hand" — that is useful signal.
