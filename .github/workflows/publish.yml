name: Publish to npm

# Fully automatic: every push to main publishes @victortomaili/agent-cli
# when package.json's version is not on npm yet, then pushes the vX.Y.Z tag.
# Releasing = bumping "version" in package.json and pushing to main.
#
# Auth = npm trusted publishing (OIDC): no NPM_TOKEN secret and no
# long-lived token (2FA-bypass tokens lose direct publish ~Jan 2027).
# ONE-TIME SETUP before this workflow can publish (else ENEEDAUTH):
#   npmjs.com → @victortomaili/agent-cli → Settings → Trusted Publisher →
#   GitHub Actions: org/user "VictorTomaili", repo "agent-cli",
#   workflow filename "publish.yml" (environment left blank).
# Requires npm >= 11.5.1 for OIDC, hence node-version 24
# (node 22 bundles npm 10). Keep the version-guard step below in sync.
# After the first OIDC publish verifies, harden (recommended):
#   npmjs.com → package Settings → Publishing access →
#   "Require two-factor authentication and disallow tokens", then revoke the
#   old automation token and remove the NPM_TOKEN repo secret:
#     gh secret remove NPM_TOKEN -R VictorTomaili/agent-cli
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the release tag back to the repo
      id-token: write # OIDC token for npm's short-lived publish token
    steps:
      - uses: actions/checkout@v5
      # setup-node v6 REQUIRED for OIDC: v5 defaults NODE_AUTH_TOKEN (the
      # GitHub token) when registry-url is set, and npm then skips the OIDC
      # exchange and PUTs with that token -> E404 (actions/setup-node#1440).
      # registry-url is deliberately OMITTED: it writes a .npmrc that wires
      # NODE_AUTH_TOKEN into registry auth, which blocks the OIDC exchange
      # (empty token -> ENEEDAUTH). publishConfig.registry in package.json
      # already targets registry.npmjs.org.
      - uses: actions/setup-node@v6
        with:
          node-version: 24 # trusted publishing needs npm >= 11.5.1
          cache: npm
      - name: Fail fast if npm is too old for trusted publishing
        run: |
          NPMV=$(npm -v)
          LOWEST=$(printf '11.5.1\n%s\n' "$NPMV" | sort -V | head -n1)
          if [ "$LOWEST" = "11.5.1" ]; then
            echo "npm $NPMV - OIDC publish supported"
          else
            echo "::error::npm $NPMV < 11.5.1, trusted publishing unsupported"
            exit 1
          fi
      - name: Debug OIDC claims
        run: |
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::no OIDC - id-token: write NOT in effect"
            env | grep -o '^[A-Z_]*' | sort | tr '\n' ' '
            exit 1
          fi
          curl -s \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | node -e '
              const fs = require("fs");
              const r = JSON.parse(fs.readFileSync(0, "utf8"));
              const p = r.value.split(".")[1];
              const b = Buffer.from(p, "base64url").toString("utf8");
              const c = JSON.parse(b);
              delete c.aud;
              console.log(JSON.stringify(c, null, 1));
            '
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check whether this version is already published
        id: v
        run: |
          NAME=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || echo "none")
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "local=$LOCAL"     >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" != "$PUBLISHED" ]; then
            echo "publish=true"  >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish ${{ steps.v.outputs.local }}
        if: steps.v.outputs.publish == 'true'
        # --loglevel silly TEMP: surfaces the OIDC exchange failure reason
        # (lib/utils/oidc.js logs it at verbose and swallows it otherwise).
        run: npm publish --access public --loglevel silly
        env:
          # Trusted publishing (OIDC) only: setup-node still defaults
          # NODE_AUTH_TOKEN when registry-url is set (actions/setup-node#1440);
          # any non-empty value makes npm skip the OIDC exchange and PUT with
          # the GitHub token -> E404. Blank it so npm falls through to OIDC.
          NODE_AUTH_TOKEN: ""
      - name: Tag the release
        if: steps.v.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.v.outputs.local }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "tag $TAG already exists, skipping"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
